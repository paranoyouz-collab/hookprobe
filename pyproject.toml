[project]
name = "hookprobe"
version = "0.1.0"
description = "Lint Claude Code hooks: wrong event names, dead matchers, and hooks that silently never fire"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["claude-code", "claude-code-hooks", "linter", "developer-tools", "agent-tooling"]
dependencies = ["rich>=13.0"]

[project.scripts]
hookprobe = "hookprobe.cli:main"

[project.urls]
Repository = "https://github.com/paranoyouz-collab/hookprobe"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hookprobe"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "C4", "SIM", "RUF"]
